# 用仓库里已提交的 web/public/papers.json 构建前端，部署到 GitHub Pages。
# 不调用任何 LLM 或外部 API，不需要配置 Secrets。
# 首次使用：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        working-directory: web
        run: npm ci && npm test && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
